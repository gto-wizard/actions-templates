repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        files: .*\.(yaml|yml)$
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.32.0
    hooks:
      - id: yamllint
        args: ["--config-data={rules: {line-length: disable}}"]
  - repo: local
    hooks:
      # Every workflow in this repo is workflow_call, so there is no CI job to
      # hang tests on. Pre-commit is the only gate the repo has.
      # The shared wire now owns the review schema itself, so it has its own suite -- and a
      # change to it still runs both action suites, because it can break the one it was not
      # written for.
      - id: shared-otlp-tests
        name: shared wire + both action suites
        entry: bash -c 'for a in .github/actions/shared .github/actions/claude-observability .github/actions/opencode-review; do python3 -m unittest discover -s "$a" -t "$a" || exit 1; done'
        language: system
        pass_filenames: false
        files: ^\.github/actions/shared/
      - id: opencode-review-tests
        name: opencode-review unit tests
        entry: python3 -m unittest discover -s .github/actions/opencode-review -t .github/actions/opencode-review
        language: system
        pass_filenames: false
        files: ^\.github/actions/opencode-review/
      - id: claude-observability-tests
        name: claude-observability unit tests
        entry: python3 -m unittest discover -s .github/actions/claude-observability -t .github/actions/claude-observability
        language: system
        pass_filenames: false
        files: ^\.github/actions/claude-observability/
