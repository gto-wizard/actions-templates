name: 🗘 Argocd sync and wait
description: Sync the given ArgoCD app(s) and wait for them to become healthy; terminates the operation on timeout.
inputs:
  ARGOCD_SERVER_URL:
    type: string
    default: grpc-argocd.services.gtowiz.com
    description: Argocd server endpoint url.
  ARGOCD_VERSION:
    type: string
    default: v3.3.6
    description: argocd cli version.
  ARGOCD_APP_NAME:
    type: string
    required: false
    description: (Deprecated) Single Argocd app name.
  ARGOCD_APP_NAMES:
    type: string
    required: false
    description: Multiline list of Argocd app names (one per line).
  WAIT_TIMEOUT_SECONDS:
    type: number
    default: 300
    description: Timeout in seconds for argocd wait.
  ARGOCD_AUTH_TOKEN:
    required: true
    description: Argocd cli user auth token.

runs:
  using: "composite"
  steps:
    - name: Download argocd binary
      shell: bash
      run: |
        curl -sL --create-dirs -o ~/.local/bin/argocd \
          "https://github.com/argoproj/argo-cd/releases/download/${{ inputs.ARGOCD_VERSION }}/argocd-linux-amd64"
        chmod +x ~/.local/bin/argocd
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Prepare app list
      id: prepare
      shell: bash
      run: |
        if [ -n "${{ inputs.ARGOCD_APP_NAMES }}" ]; then
          echo "apps<<EOF" >> $GITHUB_OUTPUT
          echo "${{ inputs.ARGOCD_APP_NAMES }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        elif [ -n "${{ inputs.ARGOCD_APP_NAME }}" ]; then
          echo "apps<<EOF" >> $GITHUB_OUTPUT
          echo "${{ inputs.ARGOCD_APP_NAME }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        else
          echo "❌ No app name(s) provided. Set ARGOCD_APP_NAME or ARGOCD_APP_NAMES."
          exit 1
        fi

    - name: Run argocd sync
      shell: bash
      run: |
        echo "🔄 Starting ArgoCD sync..."
        readarray -t apps <<< "${{ steps.prepare.outputs.apps }}"

        for app in "${apps[@]}"; do
          echo "🔄 Syncing app: $app"

          # Wait for any existing operation to complete before syncing
          # https://github.com/argoproj/argo-cd/issues/4505#issuecomment-855980253
          argocd --auth-token "${{ inputs.ARGOCD_AUTH_TOKEN }}" \
                 --server "${{ inputs.ARGOCD_SERVER_URL }}" \
                 --grpc-web app wait \
                 --timeout "${{ inputs.WAIT_TIMEOUT_SECONDS }}" \
                 --operation \
                 "$app"

          # Using error suppression for "another operation is already in progress" errors
          ( argocd --auth-token "${{ inputs.ARGOCD_AUTH_TOKEN }}" \
                   --server "${{ inputs.ARGOCD_SERVER_URL }}" \
                   --grpc-web app sync \
                   --async "$app" || true )
        done

    - name: Run argocd wait
      shell: bash
      run: |
        echo "⏳ Waiting for apps to become healthy..."
        readarray -t apps <<< "${{ steps.prepare.outputs.apps }}"

        total_budget="${{ inputs.WAIT_TIMEOUT_SECONDS }}"

        for app in "${apps[@]}"; do
          echo "⏳ Waiting on app: $app (budget: ${total_budget}s)"

          # `argocd app wait --health` FAILS FAST the moment it observes a single
          # `Degraded` health transition — it does NOT wait out --timeout. Preview
          # apps with KEDA scale-to-zero deployments legitimately flap through
          # Degraded on first sync (KEDA creating the HPA / scaling the initial
          # replica to 0, ExternalSecrets still populating the trigger secret)
          # before converging to Healthy. A single `app wait` therefore aborts the
          # deploy on a transient flap even though the app recovers seconds later.
          # (Observed behavior of the pinned argocd CLI — see ARGOCD_VERSION above;
          # `app wait --health` returns an error the first time it sees Degraded
          # rather than continuing to watch. Re-verify if bumping the CLI version.)
          #
          # Instead we RE-WAIT in a loop bounded by a single wall-clock deadline:
          # each iteration waits with only the REMAINING budget, so a transient
          # Degraded fast-fail is retried while a genuinely-stuck app exhausts the
          # budget and fails. Total wall-clock is capped at WAIT_TIMEOUT_SECONDS —
          # the budget is NOT multiplied by the number of retries.
          #
          # We ONLY retry on plausible health flaps. A hard error (bad/expired
          # token, RBAC denial, server unreachable, unknown app) is NOT a flap —
          # retrying it just burns the whole budget and mislabels an incident as a
          # "transient Degraded" timeout. Those fail fast with an accurate message.
          deadline=$(( $(date +%s) + total_budget ))
          healthy=false

          while :; do
            remaining=$(( deadline - $(date +%s) ))
            if [ "$remaining" -le 0 ]; then
              break
            fi

            # --operation waits for the in-flight sync to finish, --sync for Synced,
            # --health for Healthy. Bound each attempt by the remaining budget so the
            # loop can never exceed the total deadline. Capture stderr+stdout and the
            # exit code without tripping `set -e` (the `&& / ||` keeps the compound
            # exit status 0 so we can inspect $wait_rc ourselves).
            wait_out=$(argocd --auth-token "${{ inputs.ARGOCD_AUTH_TOKEN }}" \
                   --server "${{ inputs.ARGOCD_SERVER_URL }}" \
                   --grpc-web app wait \
                   --timeout "$remaining" \
                   --health \
                   --sync \
                   --operation \
                   "$app" 2>&1) && wait_rc=0 || wait_rc=$?
            # Surface the CLI output in the job log (capturing it hid it otherwise).
            [ -n "$wait_out" ] && echo "$wait_out"

            if [ "$wait_rc" -eq 0 ]; then
              healthy=true
              break
            fi

            # Classify the failure. Match case-insensitively on substrings that are
            # unambiguously hard errors — deliberately NOT bare "unavailable" /
            # "not found" / "eof", which also appear in legitimate Degraded health
            # descriptions (e.g. "replicas unavailable", "image ... not found") and
            # would regress the flap-tolerance this change adds. gRPC connectivity
            # (incl. transport EOF) surfaces as "code = Unavailable", which we do
            # match. When in doubt we fall through to the transient re-wait path.
            wait_out_lc=$(printf '%s' "$wait_out" | tr '[:upper:]' '[:lower:]')
            case "$wait_out_lc" in
              *permissiondenied* | *unauthenticated* | *"invalid session token"* | \
              *"connection refused"* | *"no such host"* | *"context deadline exceeded"* | \
              *"code = unavailable"* | *"code = notfound"*)
                echo "❌ $app: argocd wait failed with a hard error (auth / connectivity / unknown app), not a health flap — failing fast without burning the ${total_budget}s budget."
                exit 1
                ;;
            esac

            # Non-hard failure before the deadline — almost always a transient
            # Degraded/Progressing flap (fast-fail). Pause briefly to avoid a tight
            # retry loop, then re-wait with the reduced budget. If the app never
            # recovers, `remaining` reaches 0 and we fall through to the timeout
            # branch below.
            now_remaining=$(( deadline - $(date +%s) ))
            if [ "$now_remaining" -le 0 ]; then
              break
            fi
            # Clamp the back-off to the remaining budget so total wall-clock never
            # exceeds WAIT_TIMEOUT_SECONDS.
            backoff=5
            if [ "$now_remaining" -lt "$backoff" ]; then
              backoff="$now_remaining"
            fi
            echo "⚠️ $app not Healthy yet (no hard error detected — likely a transient Degraded/Progressing flap) — re-waiting; ${now_remaining}s budget remaining."
            sleep "$backoff"
          done

          if [ "$healthy" = true ]; then
            echo "✅ $app is Synced + Healthy."
            continue
          fi

          # Genuine timeout: the app never reached Healthy within the budget.
          # Terminate the in-flight sync operation instead of leaving it running
          # server-side — `app wait --timeout` only bounds the CLI wait; the
          # operation itself keeps running (and can hang for hours on a stuck Sync
          # hook / ImagePullBackoff) until terminated. Terminate, then fail.
          echo "❌ $app did not become Healthy within ${total_budget}s — timed out. Terminating the in-flight sync operation."
          argocd --auth-token "${{ inputs.ARGOCD_AUTH_TOKEN }}" \
                 --server "${{ inputs.ARGOCD_SERVER_URL }}" \
                 --grpc-web app terminate-op "$app" || true
          exit 1
        done
