name: 🗘 Argocd sync and wait
description: Sync the given ArgoCD app(s) and wait for them to become healthy; terminates the operation on timeout.
inputs:
  ARGOCD_SERVER_URL:
    type: string
    default: grpc-argocd.services.gtowiz.com
    description: Argocd server endpoint url.
  ARGOCD_VERSION:
    type: string
    default: v3.3.6
    description: argocd cli version.
  ARGOCD_APP_NAME:
    type: string
    required: false
    description: (Deprecated) Single Argocd app name.
  ARGOCD_APP_NAMES:
    type: string
    required: false
    description: Multiline list of Argocd app names (one per line).
  WAIT_TIMEOUT_SECONDS:
    type: number
    default: 300
    description: Timeout in seconds for argocd wait.
  PRUNE:
    type: boolean
    default: false
    description: >-
      Pass --prune to `argocd app sync`, so resources dropped from git are deleted
      instead of left behind. Opt-in per caller; see the DEADLOCK note on the sync step.
  ARGOCD_AUTH_TOKEN:
    required: true
    description: Argocd cli user auth token.

runs:
  using: "composite"
  steps:
    - name: Download argocd binary
      shell: bash
      run: |
        curl -sL --create-dirs -o ~/.local/bin/argocd \
          "https://github.com/argoproj/argo-cd/releases/download/${{ inputs.ARGOCD_VERSION }}/argocd-linux-amd64"
        chmod +x ~/.local/bin/argocd
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Prepare app list
      id: prepare
      shell: bash
      run: |
        if [ -n "${{ inputs.ARGOCD_APP_NAMES }}" ]; then
          echo "apps<<EOF" >> $GITHUB_OUTPUT
          echo "${{ inputs.ARGOCD_APP_NAMES }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        elif [ -n "${{ inputs.ARGOCD_APP_NAME }}" ]; then
          echo "apps<<EOF" >> $GITHUB_OUTPUT
          echo "${{ inputs.ARGOCD_APP_NAME }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        else
          echo "❌ No app name(s) provided. Set ARGOCD_APP_NAME or ARGOCD_APP_NAMES."
          exit 1
        fi

    - name: Run argocd sync
      shell: bash
      env:
        PRUNE: ${{ inputs.PRUNE }}
      run: |
        echo "🔄 Starting ArgoCD sync..."
        readarray -t apps <<< "${{ steps.prepare.outputs.apps }}"

        # DEADLOCK this guards against: the wait step below uses `app wait --sync`,
        # which is only satisfied by status Synced. Our ApplicationSets all set
        # `automated.prune: false`, so a resource deleted from git lingers as
        # `ignored (requires pruning)` and pins the app OutOfSync FOREVER. Every
        # subsequent deploy then applies cleanly, reports Healthy, and still burns
        # the full WAIT_TIMEOUT_SECONDS before terminate-op and exit 1 — the app is
        # fine, only the gate fails. One orphan reddens CI on every merge until a
        # human prunes by hand (OPS-1010: gto-brain, ~6 consecutive runs).
        #
        # Opt-in rather than always-on: --prune here would hand every caller
        # automatic deletion of anything removed from git, which is exactly what the
        # repo-wide `prune: false` convention exists to prevent. Callers that would
        # rather have CI prune than page a human set PRUNE: true.
        prune_args=()
        if [ "$PRUNE" = "true" ]; then
          prune_args+=(--prune)
          echo "🧹 Prune enabled — resources no longer in git will be DELETED by this sync."
        fi

        for app in "${apps[@]}"; do
          echo "🔄 Syncing app: $app"

          # Wait for any existing operation to complete before syncing
          # https://github.com/argoproj/argo-cd/issues/4505#issuecomment-855980253
          argocd --auth-token "${{ inputs.ARGOCD_AUTH_TOKEN }}" \
                 --server "${{ inputs.ARGOCD_SERVER_URL }}" \
                 --grpc-web app wait \
                 --timeout "${{ inputs.WAIT_TIMEOUT_SECONDS }}" \
                 --operation \
                 "$app"

          # Using error suppression for "another operation is already in progress" errors
          ( argocd --auth-token "${{ inputs.ARGOCD_AUTH_TOKEN }}" \
                   --server "${{ inputs.ARGOCD_SERVER_URL }}" \
                   --grpc-web app sync \
                   --async "${prune_args[@]}" "$app" || true )
        done

    - name: Run argocd wait
      shell: bash
      run: |
        echo "⏳ Waiting for apps to become healthy..."
        readarray -t apps <<< "${{ steps.prepare.outputs.apps }}"

        total_budget="${{ inputs.WAIT_TIMEOUT_SECONDS }}"

        for app in "${apps[@]}"; do
          # Skip an empty element (readarray can yield a trailing "" on a trailing
          # newline); otherwise it would fail both probes and mislabel as unreachable.
          [ -n "$app" ] || continue
          echo "⏳ Waiting on app: $app (budget: ${total_budget}s)"

          # CORRECTNESS LANDMINE: `argocd app wait --health` FAILS FAST the moment it
          # observes a single `Degraded` health transition — it does NOT wait out
          # --timeout (observed behavior of the pinned argocd CLI; re-verify if
          # bumping ARGOCD_VERSION). KEDA scale-to-zero preview apps legitimately flap
          # through Degraded on first sync before converging to Healthy, so a single
          # `app wait` aborts a deploy that recovers seconds later. Full narrative: PR.
          #
          # Fix: RE-WAIT in a loop bounded by one wall-clock deadline — each attempt
          # uses only the REMAINING budget, so total wall-clock stays ~WAIT_TIMEOUT_SECONDS
          # (plus the small `app get` probe below), not budget × retries.
          #
          # LANDMINE 2: telling a transient flap from a hard error (bad/expired token,
          # RBAC denial, unreachable server, unknown app) must NOT parse argocd's
          # free-text output — its wording collides with resource-health text (e.g.
          # "…probe failed: … connection refused"). Instead probe argocd's STRUCTURED
          # state with `app get`: a health flap does NOT break `app get`; a real
          # auth/connectivity/unknown-app problem breaks it too. Wording-independent.
          backoff_interval=5
          deadline=$(( $(date +%s) + total_budget ))
          healthy=false

          while :; do
            remaining=$(( deadline - $(date +%s) ))
            if [ "$remaining" -le 0 ]; then
              break
            fi

            # Bound each attempt by the remaining budget so the loop can never exceed
            # the total deadline. Output streams to the job log; the exit code is
            # inspected via the `if` so `set -e` is not tripped.
            if argocd --auth-token "${{ inputs.ARGOCD_AUTH_TOKEN }}" \
                   --server "${{ inputs.ARGOCD_SERVER_URL }}" \
                   --grpc-web app wait \
                   --timeout "$remaining" \
                   --health \
                   --sync \
                   --operation \
                   "$app"; then
              healthy=true
              break
            fi

            # INVARIANT 1: budget-exhaustion is checked FIRST, independent of any
            # error text. If (almost) no budget remains, this WAS the timeout —
            # break to the terminate-op path below. Never let error classification
            # pre-empt terminate-op (e.g. a client-side `--timeout` expiry can emit
            # "context deadline exceeded", which must NOT be treated as a fast-fail).
            now_remaining=$(( deadline - $(date +%s) ))
            if [ "$now_remaining" -le "$backoff_interval" ]; then
              break
            fi

            # INVARIANT 2: meaningful budget remains — is this a health flap or a
            # hard error? Probe with `app get` (structured signal, wording-agnostic)
            # rather than grepping the wait output. Probe twice, safe-side: a one-off
            # API blip during KEDA churn should not fail the deploy — "when unsure,
            # treat as transient". Any error that breaks `app get` too (auth, RBAC,
            # unreachable server, unknown app, x509, i/o timeout, dial tcp) fast-fails
            # here; anything that leaves `app get` working retries within budget.
            app_readable=false
            if argocd --auth-token "${{ inputs.ARGOCD_AUTH_TOKEN }}" \
                   --server "${{ inputs.ARGOCD_SERVER_URL }}" \
                   --grpc-web app get "$app" >/dev/null 2>&1; then
              app_readable=true
            else
              sleep 2
              if argocd --auth-token "${{ inputs.ARGOCD_AUTH_TOKEN }}" \
                     --server "${{ inputs.ARGOCD_SERVER_URL }}" \
                     --grpc-web app get "$app" >/dev/null 2>&1; then
                app_readable=true
              fi
            fi

            if [ "$app_readable" != true ]; then
              echo "❌ $app: argocd is unreachable or the app is not readable (auth / connectivity / unknown app), not a health flap — failing fast without burning the ${total_budget}s budget."
              # Best-effort terminate: if a sync op is genuinely stuck server-side and
              # this is a connectivity blip that outlasted both probes, don't orphan it.
              # `|| true` — a no-op/failure here must not mask the real error above.
              argocd --auth-token "${{ inputs.ARGOCD_AUTH_TOKEN }}" \
                     --server "${{ inputs.ARGOCD_SERVER_URL }}" \
                     --grpc-web app terminate-op "$app" || true
              exit 1
            fi

            # Server reachable and app readable: the wait failure was a health flap.
            # Pause briefly to avoid a tight retry loop, then re-wait with the reduced
            # budget. If the app never recovers, `remaining` reaches the deadline and
            # we fall through to the timeout branch below.
            echo "⚠️ $app not Healthy yet (server reachable, app readable — likely a transient Degraded/Progressing flap) — re-waiting; ${now_remaining}s budget remaining."
            sleep "$backoff_interval"
          done

          if [ "$healthy" = true ]; then
            echo "✅ $app is Synced + Healthy."
            continue
          fi

          # Genuine timeout: the app never reached Healthy within the budget.
          # Terminate the in-flight sync operation instead of leaving it running
          # server-side — `app wait --timeout` only bounds the CLI wait; the
          # operation itself keeps running (and can hang for hours on a stuck Sync
          # hook / ImagePullBackoff) until terminated. Terminate, then fail.
          echo "❌ $app did not become Healthy within ${total_budget}s — timed out. Terminating the in-flight sync operation."
          argocd --auth-token "${{ inputs.ARGOCD_AUTH_TOKEN }}" \
                 --server "${{ inputs.ARGOCD_SERVER_URL }}" \
                 --grpc-web app terminate-op "$app" || true
          exit 1
        done
