name: Claude execution with PR observability
description: Run one Claude Code invocation, classify its PR, export OTel, and retain private JSONL evidence

inputs:
  prompt:
    description: Prompt passed verbatim to `claude -p`.
    required: true
  model:
    description: Model used by the caller's Claude invocation.
    required: false
    default: sonnet
  max-turns:
    description: Maximum turns for the caller's Claude invocation.
    required: false
    default: "60"
  allowed-tools:
    description: Value passed to Claude's --allowedTools flag.
    required: false
    default: ""
  disallowed-tools:
    description: Value passed to Claude's --disallowedTools flag.
    required: false
    default: ""
  setting-sources:
    description: Optional value passed to Claude's --setting-sources flag.
    required: false
    default: ""
  strict-mcp-config:
    description: Pass --strict-mcp-config to the caller's invocation.
    required: false
    default: "false"
  disable-slash-commands:
    description: Pass --disable-slash-commands to the caller's invocation.
    required: false
    default: "false"
  session-mode:
    description: Session behavior; one of fresh, create, or resume.
    required: false
    default: fresh
  session-id:
    description: UUID used when session-mode is create or resume.
    required: false
    default: ""
  invocation:
    description: Stable name for this invocation inside a workflow run, for example primary or retry.
    required: true
  pr-json:
    description: Optional path to a GitHub PR JSON envelope. Values override the individual PR inputs.
    required: false
    default: ""
  github-token:
    description: >-
      Token used to capture the pull request's timeline — commits, comments,
      reviews, labels, force pushes, participants. Needs `pull-requests: read`.
      Pass an empty string to skip timeline capture entirely.
    required: false
    default: ${{ github.token }}
  diff-file:
    description: Optional immutable PR diff. When omitted, base-sha...head-sha is captured before Claude runs.
    required: false
    default: ""
  pr-number:
    description: Pull-request number, used when pr-json is omitted.
    required: false
    default: ""
  pr-title:
    description: Pull-request title, used when pr-json is omitted.
    required: false
    default: ""
  pr-url:
    description: Pull-request URL, used when pr-json is omitted.
    required: false
    default: ""
  pr-author:
    description: Pull-request author, used when pr-json is omitted.
    required: false
    default: ""
  head-ref:
    description: Pull-request head ref, used when pr-json is omitted.
    required: false
    default: ""
  base-sha:
    description: Base revision used to capture a diff when diff-file is omitted.
    required: false
    default: ""
  head-sha:
    description: Head revision used to capture a diff when diff-file is omitted.
    required: false
    default: ""
  api-key-alias:
    description: Safe service-key alias attached to telemetry; never pass a credential here.
    required: true
  department:
    description: Executive department attribution attached to telemetry.
    required: true
  team-id:
    description: Budget-holder team identifier attached to telemetry.
    required: true
  code-areas:
    description: Optional low-cardinality + separated code areas supplied by the consumer.
    required: false
    default: repository
  anthropic-api-key:
    description: >-
      Anthropic API key, forwarded to claude-code-action. Leave empty when the
      caller supplies credentials as step `env:` instead — e.g. ANTHROPIC_AUTH_TOKEN
      plus ANTHROPIC_BASE_URL for the LiteLLM gateway, which the action inherits.
    required: false
    default: ""
  claude-executable:
    description: >-
      Absolute path to an already-installed `claude` binary. This is how a caller
      pins a CLI version: claude-code-action installs its own runtime otherwise.
      Point it at a cached binary to keep a warm install and a known version.
    required: false
    default: ""
  python-version:
    description: >-
      Python provisioned for this action's own scripts. ARC runners ship without
      Python. Pass an empty string when the caller already guarantees python3.
    required: false
    default: "3.13"
  classifier-model:
    description: Small model used for the portable classification pass.
    required: false
    default: haiku
  artifact-retention-days:
    description: Retention for the private JSONL evidence artifact.
    required: false
    default: "14"
  metrics-endpoint:
    description: OTLP/HTTP metrics endpoint.
    required: false
    default: http://alloy-alloy-general.alloy.svc.cluster.local:4318/v1/metrics
  traces-endpoint:
    description: OTLP/HTTP traces endpoint.
    required: false
    default: http://alloy-alloy-general.alloy.svc.cluster.local:4318/v1/traces
  logs-endpoint:
    description: OTLP/HTTP logs endpoint.
    required: false
    default: https://loki.services.gtowiz.com/otlp/v1/logs

outputs:
  execution-file:
    description: Path to the caller's full stream-json transcript.
    value: ${{ steps.execute.outputs.execution-file }}
  native-session-file:
    description: Path to Claude's own session JSONL, or empty when it could not be located.
    value: ${{ steps.execute.outputs.native-session-file }}
  session-id:
    description: Session id of the caller's Claude invocation.
    value: ${{ steps.review.outputs.session_id }}
  classification-file:
    description: Path to the validated portable classification JSON.
    value: ${{ steps.execute.outputs.classification-file }}
  report-file:
    description: Path to the normalized invocation report.
    value: ${{ steps.execute.outputs.report-file }}
  change-type:
    description: Classified change type, or `unclassified`.
    value: ${{ steps.execute.outputs.change-type }}
  complexity:
    description: Classified implementation complexity, or `unclassified`.
    value: ${{ steps.execute.outputs.complexity }}
  risk:
    description: Classified operational risk, or `unclassified`.
    value: ${{ steps.execute.outputs.risk }}
  classification-status:
    description: Either success or failed; failed means the labels fell back to `unclassified`.
    value: ${{ steps.execute.outputs.classification-status }}
  total-cost-usd:
    description: Exact reconciled cost of the wrapped invocation plus classification.
    value: ${{ steps.execute.outputs.total-cost-usd }}
  artifact-name:
    description: Name of the uploaded private evidence artifact.
    value: ${{ steps.prepare.outputs.artifact-name }}

runs:
  using: composite
  steps:
    - name: Provision Python for this action
      if: inputs.python-version != ''
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # pin@v6
      with:
        python-version: ${{ inputs.python-version }}

    # Everything the two Claude invocations below need — PR metadata, the
    # immutable diff, the pull request's timeline, the trace context, and the
    # `claude_args`/`settings` values themselves — is computed once here, so the
    # CLI contract has one owner instead of being spread across YAML expressions.
    - name: Prepare immutable PR metadata and trace context
      id: prepare
      shell: bash
      env:
        INPUT_INVOCATION: ${{ inputs.invocation }}
        INPUT_PR_JSON: ${{ inputs.pr-json }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_DIFF_FILE: ${{ inputs.diff-file }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_PR_TITLE: ${{ inputs.pr-title }}
        INPUT_PR_URL: ${{ inputs.pr-url }}
        INPUT_PR_AUTHOR: ${{ inputs.pr-author }}
        INPUT_HEAD_REF: ${{ inputs.head-ref }}
        INPUT_BASE_SHA: ${{ inputs.base-sha }}
        INPUT_HEAD_SHA: ${{ inputs.head-sha }}
        INPUT_API_KEY_ALIAS: ${{ inputs.api-key-alias }}
        INPUT_DEPARTMENT: ${{ inputs.department }}
        INPUT_TEAM_ID: ${{ inputs.team-id }}
        INPUT_CODE_AREAS: ${{ inputs.code-areas }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_MAX_TURNS: ${{ inputs.max-turns }}
        INPUT_ALLOWED_TOOLS: ${{ inputs.allowed-tools }}
        INPUT_DISALLOWED_TOOLS: ${{ inputs.disallowed-tools }}
        INPUT_SETTING_SOURCES: ${{ inputs.setting-sources }}
        INPUT_STRICT_MCP_CONFIG: ${{ inputs.strict-mcp-config }}
        INPUT_DISABLE_SLASH_COMMANDS: ${{ inputs.disable-slash-commands }}
        INPUT_SESSION_MODE: ${{ inputs.session-mode }}
        INPUT_SESSION_ID: ${{ inputs.session-id }}
        INPUT_CLASSIFIER_MODEL: ${{ inputs.classifier-model }}
      run: python3 "${{ github.action_path }}/claude_observability.py" prepare

    # The caller's own review. claude-code-action owns the CLI: it installs the
    # pinned runtime, execs it with the argv we hand it via `claude_args`, and
    # writes the message stream to its `execution_file` output. `continue-on-error`
    # is what lets the reporting steps below run after a failed review — the
    # action's exit code is restored at the end, from this step's conclusion.
    - name: Run the caller's Claude invocation
      id: review
      continue-on-error: true
      uses: anthropics/claude-code-action@239e3a730883eeb5c53db12b0fc9573b3024b126 # pin@v1.0.191
      with:
        prompt: ${{ inputs.prompt }}
        claude_args: ${{ steps.prepare.outputs.review-claude-args }}
        settings: ${{ steps.prepare.outputs.claude-settings }}
        anthropic_api_key: ${{ inputs.anthropic-api-key }}
        path_to_claude_code_executable: ${{ inputs.claude-executable }}
        github_token: ${{ inputs.github-token }}

    # The portable classification pass: read-only, schema-constrained, over the
    # immutable diff plus the PR timeline. Separate from the review on purpose —
    # every repository gets the same labels regardless of what its reviewer says.
    - name: Classify the pull request
      id: classify
      if: always()
      continue-on-error: true
      uses: anthropics/claude-code-action@239e3a730883eeb5c53db12b0fc9573b3024b126 # pin@v1.0.191
      with:
        prompt: ${{ steps.prepare.outputs.classifier-prompt }}
        claude_args: ${{ steps.prepare.outputs.classifier-claude-args }}
        settings: ${{ steps.prepare.outputs.classifier-settings }}
        anthropic_api_key: ${{ inputs.anthropic-api-key }}
        path_to_claude_code_executable: ${{ inputs.claude-executable }}
        github_token: ${{ inputs.github-token }}

    - name: Reconcile cost, classification, and evidence
      id: execute
      if: always()
      shell: bash
      env:
        GTO_CLAUDE_ARTIFACT_DIR: ${{ steps.prepare.outputs.artifact-dir }}
        GTO_CLAUDE_METADATA_FILE: ${{ steps.prepare.outputs.metadata-file }}
        GTO_CLAUDE_REVIEW_EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        GTO_CLAUDE_REVIEW_SESSION_ID: ${{ steps.review.outputs.session_id }}
        GTO_CLAUDE_REVIEW_CONCLUSION: ${{ steps.review.outcome }}
        GTO_CLAUDE_CLASSIFIER_EXECUTION_FILE: ${{ steps.classify.outputs.execution_file }}
        GTO_CLAUDE_CLASSIFIER_STRUCTURED_OUTPUT: ${{ steps.classify.outputs.structured_output }}
        GTO_CLAUDE_CLASSIFIER_CONCLUSION: ${{ steps.classify.outcome }}
        INPUT_CLASSIFIER_MODEL: ${{ inputs.classifier-model }}
        OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${{ inputs.metrics-endpoint }}
        OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${{ inputs.traces-endpoint }}
        OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${{ inputs.logs-endpoint }}
      run: python3 "${{ github.action_path }}/claude_observability.py" report

    - name: Upload private Claude execution evidence
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pin@v4.6.2
      with:
        name: ${{ steps.prepare.outputs.artifact-name }}
        path: ${{ steps.prepare.outputs.artifact-dir }}
        retention-days: ${{ inputs.artifact-retention-days }}
        if-no-files-found: warn

    # Restore the caller's verdict. Everything above this line is reporting and
    # runs `if: always()`; this is the only step that decides the action's exit
    # code, and it reads exactly one thing — whether the review itself passed.
    - name: Preserve the review's outcome
      if: always()
      shell: bash
      env:
        REVIEW_OUTCOME: ${{ steps.review.outcome }}
      run: |
        set -euo pipefail
        if [ "$REVIEW_OUTCOME" != "success" ]; then
          echo "::error title=Claude review failed::the wrapped invocation ended with '$REVIEW_OUTCOME'; telemetry and evidence were still collected."
          exit 1
        fi
        echo "Wrapped Claude invocation succeeded."
